<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>QCCA 管理 - QQ Chat Exporter</title>
  <link rel="icon" href="/static/qce/favicon.ico">
  <link rel="stylesheet" href="/static/qce/qcca/qcca.css">
  <script>
    try {
      var theme = localStorage.getItem('theme');
      if (theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (error) {}
  </script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-row">
        <a class="icon-button" href="/qce" aria-label="返回 QQ Chat Exporter" title="返回 QQ Chat Exporter" data-icon="arrow-left"></a>
        <div>
          <div class="brand-title">QCCA</div>
          <div class="brand-subtitle">配置管理</div>
        </div>
      </div>

      <div class="connection-row">
        <span class="status-dot" id="connectionDot"></span>
        <span id="connectionText">正在连接</span>
        <button class="icon-button compact" id="refreshButton" type="button" aria-label="刷新配置" title="刷新配置" data-icon="refresh-cw"></button>
      </div>

      <label class="search-box">
        <span class="search-icon" data-icon="search"></span>
        <input id="userSearch" type="search" placeholder="搜索 QQ 号" autocomplete="off">
      </label>

      <div class="sidebar-heading"><span>QQ 用户</span></div>
      <nav class="user-list" id="userList" aria-label="QQ 用户列表"></nav>
      <div class="sidebar-footer" id="apiAddress">API · 正在读取</div>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <div class="breadcrumbs"><span>QCE</span><span>/</span><strong>QCCA 管理</strong></div>
        <label class="mobile-user-picker">
          <span>QQ 用户</span>
          <select id="mobileUserSelect" aria-label="选择 QQ 用户"></select>
        </label>
        <div class="topbar-actions">
          <button class="button danger ghost" id="deleteUserButton" type="button" hidden>
            <span data-icon="trash-2"></span><span>删除用户</span>
          </button>
          <button class="button primary" id="saveButton" type="button" hidden disabled>
            <span data-icon="save"></span><span>保存配置</span>
          </button>
        </div>
      </div>

      <section class="content" id="content">
        <section class="audio-model-settings" aria-labelledby="audioModelTitle">
          <div>
            <h2 id="audioModelTitle">音频识别</h2>
            <p>语音识别模型由 QCCA Agent 在后台加载。</p>
          </div>
            <span class="model-status" id="audioModelStatus" aria-live="polite">正在读取</span>
        </section>

        <section class="smtp-settings" aria-labelledby="smtpTitle">
          <div class="section-heading">
            <div>
              <h2 id="smtpTitle">邮件回复</h2>
              <p>配置用于回复消息发送者的 QQ 邮箱账号。</p>
            </div>
              <span class="smtp-status" id="smtpStatus" aria-live="polite">正在读取</span>
          </div>
          <div class="smtp-grid">
            <div class="smtp-account-row">
              <label class="field">
                <span>已保存的发件 QQ</span>
                <select id="smtpSenderQq" aria-label="发件 QQ 邮箱"></select>
              </label>
              <label class="field">
                <span>更新该 QQ 的授权码</span>
                <input id="smtpAuthCode" type="password" autocomplete="new-password" placeholder="输入新的 16 位 QQ 邮箱授权码">
              </label>
              <button class="button primary" id="saveSmtpButton" type="button">
                <span data-icon="save"></span><span>更新授权码</span>
              </button>
              <button class="button secondary" id="deleteSmtpButton" type="button" title="删除当前选中的其他发件 QQ">删除其他 QQ</button>
            </div>
            <div class="smtp-new-account-row">
              <label class="field">
                <span>新增其他发件 QQ</span>
                <input id="smtpNewSenderQq" inputmode="numeric" autocomplete="off" placeholder="仅添加其他 QQ 时填写">
              </label>
              <label class="field">
                <span>该 QQ 的授权码</span>
                <input id="smtpNewAuthCode" type="password" autocomplete="new-password" placeholder="输入 16 位 QQ 邮箱授权码">
              </label>
              <button class="button secondary" id="addSmtpButton" type="button">
                <span data-icon="save"></span><span>新增并使用</span>
              </button>
            </div>
          </div>
        </section>

        <div class="empty-state" id="emptyState">
          <span class="empty-icon" data-icon="settings-2"></span>
          <h1>尚未选择 QQ 用户</h1>
        </div>

        <div id="editor" hidden>
          <header class="editor-header">
            <div>
              <div class="eyebrow">QQ 用户</div>
              <h1 id="userTitle"></h1>
            </div>
            <div class="summary" aria-label="配置统计">
              <div><strong id="workspaceCount">0</strong><span>工作区</span></div>
              <div><strong id="sessionCount">0</strong><span>会话</span></div>
            </div>
          </header>

          <section class="settings-band">
            <div class="section-heading">
              <div>
                <h2>最近分支</h2>
              </div>
            </div>
            <div class="recent-grid">
              <label class="field"><span>工作区</span><select id="recentWorkspace"></select></label>
              <label class="field"><span>会话</span><select id="recentSession"></select></label>
            </div>
          </section>

          <section class="agent-monitor" aria-labelledby="agentMonitorTitle">
            <div class="section-heading">
              <div>
                <h2 id="agentMonitorTitle">Agent 状态</h2>
                <p id="agentStatusDetail">等待状态</p>
              </div>
              <span class="agent-status" id="agentStatusBadge" aria-live="polite">正在读取</span>
            </div>
            <div class="agent-context">
              <div><span>Agent</span><strong id="agentType">未调用</strong></div>
              <div><span>工作区</span><strong id="agentWorkspace">未调用</strong></div>
              <div><span>会话</span><strong id="agentSession">未调用</strong></div>
              <div><span>会话 ID</span><strong id="agentSessionId">未调用</strong></div>
            </div>
          </section>

          <section class="chat-records" aria-labelledby="chatRecordsTitle">
            <div class="section-heading">
              <div>
                <h2 id="chatRecordsTitle">聊天记录</h2>
                <p id="chatRecordDetail">选择会话后加载记录</p>
              </div>
              <button class="icon-button compact" id="refreshRecordsButton" type="button" aria-label="刷新聊天记录" title="刷新聊天记录" data-icon="refresh-cw"></button>
            </div>
            <div class="chat-record-list" id="chatRecordList"></div>
          </section>

          <section class="workspace-section">
            <div class="section-heading">
              <div>
                <h2>工作区与会话</h2>
              </div>
            </div>
            <div class="workspace-list" id="workspaceList"></div>
          </section>
        </div>
      </section>
    </main>
  </div>

  <div class="toast-region" id="toastRegion" aria-live="polite"></div>

  <div class="modal-backdrop" id="deleteModal" hidden>
    <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="deleteModalTitle">
      <div class="modal-header">
        <h2 id="deleteModalTitle">删除 QQ 用户</h2>
        <button class="icon-button" type="button" data-close-delete aria-label="关闭" title="关闭" data-icon="x"></button>
      </div>
      <p class="modal-copy">将删除该 QQ 用户保存的所有工作区和会话配置。此操作无法撤销。</p>
      <div class="modal-actions">
        <button class="button secondary" type="button" data-close-delete>取消</button>
        <button class="button danger" id="confirmDeleteUser" type="button">确认删除</button>
      </div>
    </div>
  </div>

  <script src="/static/qce/qcca/qcca.js"></script>
</body>
</html>
